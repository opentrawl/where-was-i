name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build for Apple silicon, macOS 14 and later
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: -mmacosx-version-min=14.0
          CGO_LDFLAGS: -mmacosx-version-min=14.0
        run: |
          go build -trimpath -ldflags "-s -w -X main.Version=${GITHUB_REF_NAME}" -o where-was-i ./cmd/where-was-i
          ./where-was-i --version
          otool -L where-was-i
          tar -czf where-was-i-macos-arm64.tar.gz where-was-i
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" where-was-i-macos-arm64.tar.gz --title "$GITHUB_REF_NAME" --generate-notes
